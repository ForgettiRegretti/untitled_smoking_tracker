<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untitled smoking tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="main_container">

        <div class="top">
            <label for="menu">menu
                <select name="menu">
                    <option value="main">Main</option>
                    <option value="settings">Settings</option>
                    <option value="statistic">Statistic</option>
                </select>
            </label>
            <h1>Untitled Smoking Tracker</h1>
        </div>

        <div class="bottom">
            <img src="./Images/IMG_3486.png" alt="base">
            <p><span id="countLabel">0</span></p>
            <button class="fluppen_counter" id="fluppenCounter">
                <img src="./Images/IMG_0023.png" alt="fluppe button">
            </button>
            <p class="quote">"Solang man lebt, soll man rauchen" - Helmut Körschgen (1923–2002)</p>
        </div>
    </div>

    <script src="script.js"></script>


</body>
</html>
