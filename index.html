<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="./Images/IMG_Icon_smoll.png">

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Untitled Smoking Tracker" />
    <meta name="apple-mobile-web-app-title" content="UnSmTr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Untitled smoking tracker</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
    <script src="script.js" defer></script>

</head>

<body>

    <div class="main_container">

        <div class="mcTop">
            <div class="menu">
                <ul>
                    <li><button id="navHome">Home</button></li>
                    <li><button id="navSettings">Settings</button></li>
                    <li><button id="navStats">Statistic</button></li>
                </ul>
            </div>
            <img id="settingsIcon" src="./Images/IMG_settingsIcon.png" alt="Settings Icon">
            <h1>Untitled Smoking Tracker</h1>
        </div>

        <div class="mainPage" id="mainPage">
            <div class="imgWrapper">
                <img class="lBackground" src="./Images/IMG_lungBackground.png" alt="background">
                <div class="fluppenClip">
                    <img class="fluppenBerg" src="./Images/IMG_fluppenBerg.png" alt="fluppen berg">
                </div>
                <img class="lOverlay" src="./Images/IMG_lungOverlay.png" alt="overlay">

            </div>
            <div class="danger hidden" id="danger"><p id="phrase">what a dissapointment you are</p></div>

            <p class="count_label"><span id="countLabel">0</span> / <span id="maxLabel">0</span></p>
            <button class="fluppen_counter" id="fluppenCounter">
                <img src="./Images/IMG_fluppenButton.png" alt="fluppe button">
            </button>
            <p class="quote">"If i can't smoke in heaven, I shall not go" - Mark Twain</p>
            <p class="moneyWastedToday hidden"><span id="moneyWastedToday">0.00</span> Euro</p>
        </div>

        <div class="settingsPage hidden" id="settingsPage">
            <h2>Settings</h2>
            <label for="maxInput">Max Fluppen pro tag:</label>
            <input type="number" id="maxInput" name="maxInput" value="10" min="0" step="1" inputmode="numeric">
            <label for="costFluppe"> kosten fuer einzelne fluppe</label>
            <input type="number" id="costFluppe" name="costFluppe" value="0.45" min="0" inputmode="numeric">
            <button id="resetLS">reset localStorage</button>
            <button id="resetHistory">reset history</button>
            <button id="testHistory">add test history to localStorage</button>
            <div>
                <label for="radioQuote">Quote</label>
                <input type="radio" id="radioQuote" name="footnote" value="radioQuote">
                <label for="radioMoney">Money</label>
                <input type="radio" id="radioMoney" name="footnote" value="radioMoney" checked>
            </div>
        </div>

        <div class="stats hidden" id="statsPage">
            <canvas id="testChart"></canvas> 
        </div>

    </div>

</body>
</html>
