<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="./Images/IMG_Icon_smoll.png">

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Untitled Smoking Tracker" />
    <meta name="apple-mobile-web-app-title" content="UnSmTr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untitled smoking tracker</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>

    <div class="main_container">

        <div class="mcTop">
            <label for="menu">menu
            <select name="menu" id="menu">
                <option value="main">Main</option>
                <option value="settings">Settings</option>
                <option value="statistic">Statistic</option>
            </select>
            </label>
            <h1>Untitled Smoking Tracker</h1>
        </div>

        <div class="mcBottom" id="MCBottom">
            <img src="./Images/IMG_lungBase.png" alt="base">
            <p class="count_label"><span id="countLabel">0</span> / <span id="maxLabel"></span></p>
            <button class="fluppen_counter" id="fluppenCounter">
                <img src="./Images/IMG_fluppenButton.png" alt="fluppe button">
            </button>
            <p class="quote">"Solang man lebt, soll man rauchen" - Helmut Körschgen (1923–2002)</p>
        </div>

        <div class="settingsContainer" id="settings">
            <h2>Settings</h2>
            <label for="maxInput">Max Fluppen pro tag:</label>
            <input type="number" id="maxInput" name="maxInput">
        </div>
        
    </div>

</body>
</html>
