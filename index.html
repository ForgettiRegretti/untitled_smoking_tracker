<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="./Images/IMG_Icon_smoll.png">

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Untitled Smoking Tracker" />
    <meta name="apple-mobile-web-app-title" content="UnSmTr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Untitled smoking tracker</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>

    <div class="main_container">

        <div class="mcTop">
            <div class="menu">
                <ul>
                    <li><button id="navHome">Home</button></li>
                    <li><button id="navSettings">Settings</button></li>
                    <li><button id="navStats">Statistic</button></li>
                </ul>
            </div>
            <img id="settingsIcon" src="./Images/IMG_settingsIcon.png" alt="Settings Icon">
            <h1>Untitled Smoking Tracker</h1>
        </div>

        <div class="mcBottom" id="MCBottom">
            <div class="imgWrapper">
                <img src="./Images/IMG_lungBackground.png" alt="background" class="lBackground">
                <img src="./Images/IMG_fluppenBerg.png" alt="fluppen berg" class="fluppenBerg">
                <img src="./Images/IMG_lungOverlay.png" alt="overlay" class="lOverlay">
            </div>
            <p class="count_label"><span id="countLabel">0</span> / <span id="maxLabel"></span></p>
            <button class="fluppen_counter" id="fluppenCounter">
                <img src="./Images/IMG_fluppenButton.png" alt="fluppe button">
            </button>
            <p class="quote">"Solang man lebt, soll man rauchen" - Helmut Körschgen (1923–2002)</p>
        </div>

        <div class="settingsContainer hidden" id="settings">
            <h2>Settings</h2>
            <label for="maxInput">Max Fluppen pro tag:</label>
            <input type="number" id="maxInput" name="maxInput" min="0" step="1" inputmode="numeric">
            <button id="resetLS">reset localStorage</button>
        </div>
        
    </div>

</body>
</html>
